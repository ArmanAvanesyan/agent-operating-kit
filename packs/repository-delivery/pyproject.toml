[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-delivery"
version = "0.1.0"
description = "Portable repository delivery skills and preservation evidence"
requires-python = ">=3.11"
readme = "docs/README.md"

[project.optional-dependencies]
aok = ["jsonschema>=4.26,<5"]

[project.scripts]
repo-delivery = "repo_delivery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
